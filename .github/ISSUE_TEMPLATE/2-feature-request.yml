name: Feature request
description: Suggest something new for Huedra, or a change to something it does.
title: "[Feature]: "
labels: ["enhancement", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Huedra is built to stay small and quiet in the
        background, so a request is weighed against what it adds to the program,
        its memory and its upkeep. Saying what problem it solves helps more than
        how it should look.

  - type: checkboxes
    id: checks
    attributes:
      label: Before opening
      options:
        - label: I searched the [open and closed issues](https://github.com/apixelsnet/huedra/issues?q=is%3Aissue) and this has not been asked for.
          required: true
        - label: I read the [user guide](https://github.com/apixelsnet/huedra/blob/main/docs/USER-GUIDE.md) and the [feature docs](https://github.com/apixelsnet/huedra/tree/main/docs/features) for this area.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
      placeholder: My second monitor is only for chat, but HDR follows a game I drag onto it.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What you would like
      description: How Huedra could solve it.
      placeholder: A setting per display that keeps it in SDR whatever runs on it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways around it, and how other tools handle it, if you know.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Huedra is it about? Pick every one that applies.
      multiple: true
      options:
        - HDR switching and displays
        - Games and game detection
        - Video players and streaming sites
        - Browser extension
        - Tray icon and keyboard shortcuts
        - Settings window
        - Updates
        - Command line
        - Installing and removing
        - Other
    validations:
      required: true

  - type: dropdown
    id: contribute
    attributes:
      label: Would you work on it?
      options:
        - Yes, I would like to open a pull request
        - Maybe, with some pointers
        - No
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Mock-ups, screenshots, links.
