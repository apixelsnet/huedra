name: Question
description: Ask how to do something with Huedra, when the README and the user guide do not say.
title: "[Question]: "
labels: ["question"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before opening
      options:
        - label: I read the [README](https://github.com/apixelsnet/huedra#readme) and the [user guide](https://github.com/apixelsnet/huedra/blob/main/docs/USER-GUIDE.md), and searched the [issues](https://github.com/apixelsnet/huedra/issues?q=is%3Aissue).
          required: true

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you are trying to do, and what you have tried.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Huedra version
      description: Settings › General › About, or `huedra --version`, if it matters.
