# Every issue starts from one of the forms in this folder. The links below are
# for what does not belong in a public issue, and for answers that already exist.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/apixelsnet/huedra/security/advisories/new
    about: Report it privately, not in a public issue. SECURITY.md says what counts.
  - name: User guide
    url: https://github.com/apixelsnet/huedra/blob/main/docs/USER-GUIDE.md
    about: Every setting, the browser extension, the command line and troubleshooting.
  - name: Feature documentation
    url: https://github.com/apixelsnet/huedra/tree/main/docs/features
    about: What each feature does, how it was built, and what was and was not verified.
