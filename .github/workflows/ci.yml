# Builds, tests and packs Huedra and its browser extension.
#
# - build: the same container and script as build/remote-build.sh
#   (build/Dockerfile, build/ci.sh): fmt, clippy for Linux and Windows,
#   cargo deny, tests, docs, Windows release build, size limit.
# - windows: runs the built huedra.exe on Windows, checks the changelogs and
#   packs the release folder and the extension zip.
# - release: on a tag vX.Y.Z, signs the release (when the MINISIGN_SECRET_KEY
#   secret is set) and publishes a GitHub release whose notes are that
#   version's section of CHANGELOG.md.
#
# Repository variables HUEDRA_UPDATE_KEY and HUEDRA_UPDATE_URL, when both are
# set, build the update check in (docs/features/11-updates.md).
# Feature doc: docs/features/12-packaging.md.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  TARGET: x86_64-pc-windows-msvc

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: build
          tags: huedra-build
          load: true
          cache-from: type=gha,scope=huedra-build
          cache-to: type=gha,scope=huedra-build,mode=max

      - name: Restore caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cache/cargo
            ${{ runner.temp }}/cache/xwin
            ${{ runner.temp }}/cache/target
          key: huedra-${{ hashFiles('rust-toolchain.toml', 'build/Dockerfile') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            huedra-${{ hashFiles('rust-toolchain.toml', 'build/Dockerfile') }}-

      - name: Check, test, build
        env:
          HUEDRA_UPDATE_KEY: ${{ vars.HUEDRA_UPDATE_KEY }}
          HUEDRA_UPDATE_URL: ${{ vars.HUEDRA_UPDATE_URL }}
        run: |
          cache="$RUNNER_TEMP/cache"
          mkdir -p "$cache/cargo" "$cache/xwin" "$cache/target"
          update_env=()
          for name in HUEDRA_UPDATE_KEY HUEDRA_UPDATE_URL; do
            if [ -n "${!name}" ]; then update_env+=(-e "$name"); fi
          done
          status=0
          docker run --rm "${update_env[@]}" \
            -v "$PWD:/src" -w /src \
            -v "$cache/target:/target" -e CARGO_TARGET_DIR=/target \
            -v "$cache/cargo:/usr/local/cargo/registry" \
            -v "$cache/xwin:/xwin-cache" \
            huedra-build bash build/ci.sh || status=$?
          # The container runs as root; hand the files back for the cache.
          sudo chown -R "$(id -u):$(id -g)" "$cache" "$PWD"
          exit "$status"

      - name: Cargo.lock is up to date
        run: git diff --exit-code Cargo.lock

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: huedra-exe
          path: ${{ runner.temp }}/cache/target/${{ env.TARGET }}/release/huedra.exe
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Run on Windows and pack
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: huedra-exe
          path: dist

      - name: Run huedra.exe
        run: |
          $line = (& dist\huedra.exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "--version exited with $LASTEXITCODE" }
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($line -ne "Huedra $cargo") { throw "--version printed '$line', expected 'Huedra $cargo'" }
          & dist\huedra.exe --no-such-option 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 2) { throw "an unknown option exited with $LASTEXITCODE, expected 2" }
          "$line runs on $((Get-CimInstance Win32_OperatingSystem).Caption)"
          $global:LASTEXITCODE = 0

      - name: Check changelogs
        run: build/check-changelog.ps1

      - name: Pack release
        run: build/pack-release.ps1 -Exe dist\huedra.exe -OutDir dist\release

      - name: Pack extension
        run: build/pack-extension.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: huedra-release
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: huedra-extension
          path: dist/huedra-extension-*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: huedra-release
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: huedra-extension
          path: release

      - name: Version matches the tag
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' release/release.toml)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, program $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section '## $VERSION'"; exit 1; }
          cat notes.md

      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::warning::MINISIGN_SECRET_KEY is not set: the release is not signed and the updater will refuse it."
            exit 0
          fi
          sudo apt-get install -y --no-install-recommends minisign >/dev/null
          key="$RUNNER_TEMP/huedra.key"
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -t "huedra $VERSION" \
            -m release/release.toml "release/huedra-$VERSION-windows-x64.zip"
          rm -f "$key"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Huedra $VERSION" --notes-file notes.md --verify-tag release/*
