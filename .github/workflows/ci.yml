name: CI

# Checks every push to the main branch and every pull request, and builds what a
# release ships. The Release workflow calls it with the version to build.
#
# - build: the same container and script as build/remote-build.sh
#   (build/Dockerfile, build/ci.sh): fmt, clippy for Linux and Windows,
#   cargo deny, tests, docs, Windows release build, size limit.
# - windows: runs the built huedra.exe on Windows, checks the changelogs and
#   packs the release folder and the browser extension's zip.
#
# Repository variables HUEDRA_UPDATE_KEY and HUEDRA_UPDATE_URL, when both are
# set, build the update check in (docs/features/11-updates.md).
# Feature doc: docs/features/12-packaging.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version to build, such as 0.2.0. Written into Cargo.toml for this build only.
        type: string
        required: true
      ref:
        description: Tag or commit to build.
        type: string
        required: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A release build is never cut short.
  cancel-in-progress: ${{ inputs.version == '' }}

permissions:
  contents: read

env:
  TARGET: x86_64-pc-windows-msvc
  VERSION: ${{ inputs.version }}

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after the checkout pushes with git; the token is not left in the folder.
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Set the version
        if: env.VERSION != ''
        run: |
          sed -i "0,/^version = \".*\"$/s//version = \"$VERSION\"/" Cargo.toml
          grep -x "version = \"$VERSION\"" Cargo.toml

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # The build record the action uploads as an artifact; kept as briefly
          # as the other artifacts.
          DOCKER_BUILD_RECORD_RETENTION_DAYS: 1
        with:
          context: build
          tags: huedra-build
          load: true
          cache-from: type=gha,scope=huedra-build
          cache-to: type=gha,scope=huedra-build,mode=max

      # Linux, Windows debug (clippy, tests) and Windows release builds together
      # outgrow the runner's free disk; the runner's preinstalled SDKs are not used.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # Downloads (crates, Microsoft CRT and SDK) and build output are kept
      # apart: the first is small and changes rarely, the second is large.
      - name: Restore downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: downloads
        with:
          path: |
            ${{ runner.temp }}/cache/cargo
            ${{ runner.temp }}/cache/xwin
          key: downloads-${{ hashFiles('build/Dockerfile') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: downloads-${{ hashFiles('build/Dockerfile') }}-

      - name: Restore build output
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: target
        with:
          path: ${{ runner.temp }}/cache/target
          key: target-${{ hashFiles('rust-toolchain.toml', 'build/Dockerfile') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: target-${{ hashFiles('rust-toolchain.toml', 'build/Dockerfile') }}-

      - name: Check, test, build
        env:
          HUEDRA_UPDATE_KEY: ${{ vars.HUEDRA_UPDATE_KEY }}
          HUEDRA_UPDATE_URL: ${{ vars.HUEDRA_UPDATE_URL }}
        run: |
          cache="$RUNNER_TEMP/cache"
          mkdir -p "$cache/cargo" "$cache/xwin" "$cache/target"
          update_env=()
          for name in HUEDRA_UPDATE_KEY HUEDRA_UPDATE_URL; do
            if [ -n "${!name}" ]; then update_env+=(-e "$name"); fi
          done
          status=0
          docker run --rm "${update_env[@]}" \
            -v "$PWD:/src" -w /src \
            -v "$cache/target:/target" -e CARGO_TARGET_DIR=/target \
            -v "$cache/cargo:/usr/local/cargo/registry" \
            -v "$cache/xwin:/xwin-cache" \
            huedra-build bash build/ci.sh || status=$?
          # The container runs as root; hand the files back for the cache.
          sudo chown -R "$(id -u):$(id -g)" "$cache" "$PWD"
          exit "$status"

      - name: Keep new extension icons
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-icons
          path: ${{ runner.temp }}/cache/target/extension-icons/
          if-no-files-found: ignore
          retention-days: 1

      # A release build changes the version, and with it Cargo.lock.
      - name: Cargo.lock is up to date
        if: env.VERSION == ''
        run: git diff --exit-code Cargo.lock

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: huedra-exe
          path: ${{ runner.temp }}/cache/target/${{ env.TARGET }}/release/huedra.exe
          if-no-files-found: error
          retention-days: 1

      # Caches are written only from main, so pull requests and releases cannot
      # fill the repository's cache space; they read main's.
      - name: Save downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/cache/cargo
            ${{ runner.temp }}/cache/xwin
          key: ${{ steps.downloads.outputs.cache-primary-key }}

      - name: Trim build output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.target.outputs.cache-hit != 'true'
        run: |
          target="$RUNNER_TEMP/cache/target"
          # Incremental state and documentation are rebuilt quickly and are most of the size.
          find "$target" -maxdepth 3 -type d \( -name incremental -o -name doc \) -prune -exec rm -rf {} +
          du -sh "$target"
          df -h /

      - name: Save build output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.target.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cache/target
          key: ${{ steps.target.outputs.cache-primary-key }}

  windows:
    name: Run on Windows and pack
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: huedra-exe
          path: dist

      - name: Run huedra.exe
        run: |
          $expected = $env:VERSION
          if (-not $expected) {
            $expected = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
          }
          $line = (& dist\huedra.exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "--version exited with $LASTEXITCODE" }
          if ($line -ne "Huedra $expected") { throw "--version printed '$line', expected 'Huedra $expected'" }
          & dist\huedra.exe --no-such-option 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 2) { throw "an unknown option exited with $LASTEXITCODE, expected 2" }
          "$line runs on $((Get-CimInstance Win32_OperatingSystem).Caption)"
          $global:LASTEXITCODE = 0

      - name: Check changelogs
        run: build/check-changelog.ps1 -Version $env:VERSION

      - name: Pack release
        run: build/pack-release.ps1 -Exe dist\huedra.exe -OutDir dist\release

      - name: Pack extension
        run: build/pack-extension.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: huedra-release
          path: dist/release/
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: huedra-extension
          path: dist/huedra-extension-*.zip
          if-no-files-found: error
          retention-days: 1
