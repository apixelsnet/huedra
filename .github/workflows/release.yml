name: Release

# Builds the main branch and publishes it as a version.
#
# Two ways in:
#   - Actions > Release > Run workflow. Say how far to bump, or type a version. The
#     workflow tags the tip of the main branch and builds that tag.
#   - Push a tag yourself:  git tag v0.2.0 && git push origin v0.2.0
#
# The version is the tag: the build is told it, so Cargo.toml does not have to be
# edited first. Versions are MAJOR.MINOR.PATCH only; the updater and the Windows
# version resource have no pre-release part.
#
# Out comes a GitHub release with the program zip, its minisign signature and the
# browser extension's zip; releases before 1.0.0 are pre-releases titled "beta".
# The notes start with a table of the downloads, then the version's section of
# CHANGELOG.md (or its Unreleased section), then the list GitHub writes. The files
# the updater reads (huedra.exe, release.toml, release-notes.md and their signatures) go to the fixed
# release "update-channel". Signing needs the MINISIGN_SECRET_KEY and
# MINISIGN_PASSWORD secrets. Feature docs: 11-updates.md, 12-packaging.md.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      bump:
        description: How far to move on from the last release
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Or an exact version, such as 0.2.0. Wins over the bump.
        type: string
        required: false

# One release at a time, and none cut short half way.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Pick the version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after the checkout pushes with git; the token is not left in the folder.
          persist-credentials: false
          fetch-depth: 0

      - name: Work out the version, and tag it
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
          MAIN: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          released='^[0-9]+\.[0-9]+\.[0-9]+$'

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            if [ "$GITHUB_REF_NAME" != "$MAIN" ]; then
              echo "::error::Releases are cut from $MAIN, not from $GITHUB_REF_NAME."
              exit 1
            fi
            version=${WANTED#v}
            if [ -z "$version" ]; then
              last=$(git tag --list 'v*' --sort=-v:refname | sed 's/^v//' | grep -E "$released" | head -n 1 || true)
              if [ -z "$last" ]; then
                # The first release takes the version Cargo.toml carries.
                version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
              else
                IFS=. read -r major minor patch <<< "$last"
                case "$BUMP" in
                  major) version=$((major + 1)).0.0 ;;
                  minor) version=$major.$((minor + 1)).0 ;;
                  *) version=$major.$minor.$((patch + 1)) ;;
                esac
              fi
            fi
          fi
          if ! [[ "$version" =~ $released ]]; then
            echo "::error::'$version' does not read as a version like 1.2.3."
            exit 1
          fi

          tag=v$version
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            at=$(git rev-list -n 1 "refs/tags/$tag" 2>/dev/null || true)
            if [ -z "$at" ]; then
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" --silent
            elif [ "$at" != "$GITHUB_SHA" ]; then
              echo "::error::$tag exists already and names another commit."
              exit 1
            fi
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing Huedra $version from ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ needs.version.outputs.tag }}

  publish:
    name: Publish
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: huedra-release
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: huedra-extension
          path: dist

      - name: The program is the tag's version
        run: grep -x "version = \"$VERSION\"" dist/release.toml

      - name: Sort the files
        run: |
          set -euo pipefail
          # What people download goes on the version's release; what the
          # updater reads goes on the update channel.
          mkdir download channel
          mv "dist/huedra-$VERSION-windows-x64.zip" download/
          extension=$(ls dist/huedra-extension-*.zip)
          mv "$extension" "download/huedra-browser-extension-$(basename "$extension" .zip | sed 's/^huedra-extension-//').zip"
          mv dist/huedra.exe dist/release.toml channel/
          ls -l download channel

      - name: Release notes
        env:
          PUBLIC_KEY: ${{ vars.HUEDRA_UPDATE_KEY }}
        run: |
          set -euo pipefail
          section() {
            awk -v v="$1" '
              /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
              found { print }
            ' CHANGELOG.md | sed '/./,$!d'
          }
          section "$VERSION" > changes.md
          if ! grep -q . changes.md; then section Unreleased > changes.md; fi
          if ! grep -q . changes.md; then
            echo "::error::CHANGELOG.md has neither a section '## $VERSION' nor anything under '## Unreleased'."
            exit 1
          fi
          extension=$(basename download/huedra-browser-extension-*.zip)
          {
            if [ "${VERSION%%.*}" = 0 ]; then
              echo "> **Beta.** A pre-release for testing; read the [disclaimer](https://github.com/$GITHUB_REPOSITORY#disclaimer) first."
              echo
            fi
            echo "## Downloads"
            echo
            echo "| File | What it is |"
            echo "| --- | --- |"
            echo "| **huedra-$VERSION-windows-x64.zip** | **The program. Download this one**, unpack it into a folder of your own and start \`huedra.exe\`. Windows 10 (1903 or later) or 11, x64. |"
            echo "| huedra-$VERSION-windows-x64.zip.minisig | Signature of the zip, to check it with [minisign](https://jedisct1.github.io/minisign/) (optional). |"
            echo "| $extension | The browser extension, for HDR video on YouTube and streaming sites. Optional; until it is in the browser stores, load it unpacked in developer mode. |"
            echo "| Source code | Added by GitHub. Not needed to run Huedra. |"
            echo
            if [ -n "$PUBLIC_KEY" ]; then
              echo "Check the download (optional):"
              echo
              echo '```'
              echo "minisign -Vm huedra-$VERSION-windows-x64.zip -P $PUBLIC_KEY"
              echo '```'
              echo
            fi
            echo "## Changes"
            echo
            cat changes.md
            echo
            echo "## Thank you"
            echo
            echo "Thank you to everyone who supports Huedra: the [supporters](https://github.com/$GITHUB_REPOSITORY/blob/main/SUPPORTERS.md) and everyone who reports problems and tests."
          } > notes.md
          cat notes.md
          # The same changes for the update dialog in the program, signed with the
          # manifest. The first line names the version the notes belong to.
          {
            echo "# Huedra $VERSION"
            echo
            cat changes.md
          } > channel/release-notes.md

      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::warning::MINISIGN_SECRET_KEY is not set: the release is not signed, and the updater refuses it."
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends minisign > /dev/null
          key="$RUNNER_TEMP/huedra.key"
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -t "huedra $VERSION" \
            -m channel/release.toml channel/release-notes.md "download/huedra-$VERSION-windows-x64.zip"
          rm -f "$key"

      - name: Publish the release
        run: |
          set -euo pipefail
          # Releases before 1.0.0 are betas.
          title="Huedra $VERSION"
          flags=()
          if [ "${VERSION%%.*}" = 0 ]; then
            title="$title beta"
            flags+=(--prerelease)
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Run again for a release that is there already: put the new files in its place.
            gh release upload "$TAG" download/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "$title" --notes-file notes.md "${flags[@]}" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" download/* --title "$title" --notes-file notes.md \
              --generate-notes --verify-tag "${flags[@]}" --repo "$GITHUB_REPOSITORY"
          fi

      # The updater reads https://github.com/<repository>/releases/download/update-channel/
      # (repository variable HUEDRA_UPDATE_URL): one fixed place, because GitHub's
      # "latest" address skips pre-releases. Every release replaces its files.
      - name: Update the update channel
        run: |
          set -euo pipefail
          channel=update-channel
          if ! gh release view "$channel" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$channel" --target "$(git rev-parse HEAD)" --prerelease --latest=false \
              --title "Update channel" \
              --notes "Files Huedra's automatic updates read. To install Huedra, download the program zip from a numbered release instead." \
              --repo "$GITHUB_REPOSITORY"
          fi
          # The program first and the manifest last, so the signed manifest never
          # names a program that is not there yet.
          if [ ! -f channel/release.toml.minisig ]; then
            echo "::warning::Not signed, so the update channel is left as it was."
            exit 0
          fi
          gh release upload "$channel" channel/huedra.exe --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$channel" channel/release-notes.md channel/release-notes.md.minisig --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$channel" channel/release.toml.minisig --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$channel" channel/release.toml --clobber --repo "$GITHUB_REPOSITORY"
