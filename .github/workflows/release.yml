name: Release

# Builds the main branch and publishes it as a version.
#
# Two ways in:
#   - Actions > Release > Run workflow. Say how far to bump, or type a version. The
#     workflow tags the tip of the main branch and builds that tag.
#   - Push a tag yourself:  git tag v0.2.0 && git push origin v0.2.0
#
# The version is the tag: the build is told it, so Cargo.toml does not have to be
# edited first. Versions are MAJOR.MINOR.PATCH only; the updater and the Windows
# version resource have no pre-release part.
#
# Out comes a GitHub release with the program zip, huedra.exe, release.toml (the
# updater's manifest), their minisign signatures when the MINISIGN_SECRET_KEY and
# MINISIGN_PASSWORD secrets are set, the browser extension's zip and SHA256SUMS.
# The notes are the version's section of CHANGELOG.md, or its Unreleased section,
# followed by the list GitHub writes. Feature docs: 11-updates.md, 12-packaging.md.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      bump:
        description: How far to move on from the last release
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Or an exact version, such as 0.2.0. Wins over the bump.
        type: string
        required: false

# One release at a time, and none cut short half way.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Pick the version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after the checkout pushes with git; the token is not left in the folder.
          persist-credentials: false
          fetch-depth: 0

      - name: Work out the version, and tag it
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
          MAIN: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          released='^[0-9]+\.[0-9]+\.[0-9]+$'

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            if [ "$GITHUB_REF_NAME" != "$MAIN" ]; then
              echo "::error::Releases are cut from $MAIN, not from $GITHUB_REF_NAME."
              exit 1
            fi
            version=${WANTED#v}
            if [ -z "$version" ]; then
              last=$(git tag --list 'v*' --sort=-v:refname | sed 's/^v//' | grep -E "$released" | head -n 1 || true)
              if [ -z "$last" ]; then
                # The first release takes the version Cargo.toml carries.
                version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
              else
                IFS=. read -r major minor patch <<< "$last"
                case "$BUMP" in
                  major) version=$((major + 1)).0.0 ;;
                  minor) version=$major.$((minor + 1)).0 ;;
                  *) version=$major.$minor.$((patch + 1)) ;;
                esac
              fi
            fi
          fi
          if ! [[ "$version" =~ $released ]]; then
            echo "::error::'$version' does not read as a version like 1.2.3."
            exit 1
          fi

          tag=v$version
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            at=$(git rev-list -n 1 "refs/tags/$tag" 2>/dev/null || true)
            if [ -z "$at" ]; then
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" --silent
            elif [ "$at" != "$GITHUB_SHA" ]; then
              echo "::error::$tag exists already and names another commit."
              exit 1
            fi
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing Huedra $version from ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ needs.version.outputs.tag }}

  publish:
    name: Publish
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: huedra-release
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: huedra-extension
          path: dist

      - name: The program is the tag's version
        run: grep -x "version = \"$VERSION\"" dist/release.toml

      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          section() {
            awk -v v="$1" '
              /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
              found { print }
            ' CHANGELOG.md | sed '/./,$!d'
          }
          section "$VERSION" > notes.md
          if ! grep -q . notes.md; then section Unreleased > notes.md; fi
          if ! grep -q . notes.md; then
            echo "::error::CHANGELOG.md has neither a section '## $VERSION' nor anything under '## Unreleased'."
            exit 1
          fi
          cat notes.md

      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::warning::MINISIGN_SECRET_KEY is not set: the release is not signed, and the updater refuses it."
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends minisign > /dev/null
          key="$RUNNER_TEMP/huedra.key"
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -t "huedra $VERSION" \
            -m dist/release.toml "dist/huedra-$VERSION-windows-x64.zip"
          rm -f "$key"

      - name: Publish the release
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Run again for a release that is there already: put the new files in its place.
            gh release upload "$TAG" ./* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" ./* --title "Huedra $VERSION" --notes-file ../notes.md \
              --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
