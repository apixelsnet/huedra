[package]
name = "huedra-ui"
description = "The Huedra settings window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
huedra-core.workspace = true

[target.'cfg(windows)'.dependencies]
huedra-win.workspace = true
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "accessibility",
] }

[build-dependencies]
slint-build = "1.18.1"

[lints]
workspace = true
