[graph]
# Only the shipped target. Linux builds exist for tests; checking both would
# let Linux-only dependencies of Windows-only crates (zbus via Slint's winit
# backend) into the graph.
targets = ["x86_64-pc-windows-msvc"]

[advisories]
yanked = "deny"
ignore = [
    # Unmaintained, not vulnerable; Slint's build and macros use it (through
    # spin_on) and no release of Slint has dropped it yet. Revisit on Slint
    # updates.
    { id = "RUSTSEC-2026-0441", reason = "pin-utils via Slint; unmaintained notice only" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    # Slint, used under its royalty-free license: the About section of the
    # General page shows the required attribution (AboutSlint).
    "LicenseRef-Slint-Royalty-free-2.0",
]
confidence-threshold = 0.9
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
